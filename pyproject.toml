[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml-v1-to-v2-migrator"
version = "0.1.0"
description = "Starter converter for SysML v1 .mdzip to SysML v2-friendly semantic artifacts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sysml-migrate-v1 = "sysml_migration.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
